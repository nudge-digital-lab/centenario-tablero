<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tablero Centenario Automotores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap">
<style>
  :root { --negro: #0a0a0b; --panel: #18181b; --borde: #2a2a2f; --rojo: #ed3338; --tinta: #f4f4f5; --tinta-2: #a1a1aa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--negro); color: var(--tinta); font: 16px/1.45 "Inter", -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--borde); border-radius: 18px; padding: 32px 28px; text-align: center; }
  .logo { font: 800 32px/1 "Saira Condensed", "Arial Narrow", sans-serif; letter-spacing: .04em; color: #fff; }
  .logo span { color: var(--rojo); }
  .lema { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--tinta-2); margin: 8px 0 24px; }
  label { display: block; text-align: left; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; font-size: 16px; font-family: inherit; padding: 12px 14px; border: 1.5px solid var(--borde); border-radius: 10px; background: var(--negro); color: var(--tinta); }
  input:focus { outline: 2px solid var(--rojo); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 14px; font-weight: 700; font-size: 16px; font-family: inherit; color: #fff; background: var(--rojo); border: 0; border-radius: 999px; padding: 12px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: #ff5a5f; font-size: 14px; min-height: 20px; margin: 10px 0 0; }
  .pie { font-size: 12px; color: var(--tinta-2); margin-top: 18px; }
</style>
</head>
<body>
<form id="f">
  <div class="logo">CENTENARIO <span>AUTOMOTORES</span></div>
  <div class="lema">Tablero interno</div>
  <label for="clave">Clave</label>
  <input id="clave" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
  <button id="entrar">Entrar</button>
  <p class="error" id="error" role="alert"></p>
  <div class="pie">Studio Complex · uso interno</div>
</form>
